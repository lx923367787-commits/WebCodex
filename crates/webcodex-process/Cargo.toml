[package]
name = "webcodex-process"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
cli-catalog = ["dep:serde", "dep:serde_json", "dep:tokio", "dep:tempfile", "dep:url", "dep:webcodex-core"]

[dependencies]
webcodex-core = { path = "../webcodex-core", optional = true }
serde_json = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "time"], optional = true }
tempfile = { version = "3", optional = true }
url = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_System_Rpc",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "process_tree_helper"
path = "src/bin/process_tree_helper.rs"

[dev-dependencies]
tempfile = "3"

# The integration tests probe process liveness directly (OpenProcess +
# GetExitCodeProcess) instead of shelling out to tasklist.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
